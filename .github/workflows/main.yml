
name: Build Eden-NS2 for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
  git
  patch
  autotools
  mingw-w64-x86_64-toolchain
  mingw-w64-x86_64-cmake
  mingw-w64-x86_64-ninja
  mingw-w64-x86_64-qt6
  mingw-w64-x86_64-ffmpeg
  mingw-w64-x86_64-sdl3
  mingw-w64-x86_64-boost
  mingw-w64-x86_64-openssl
  mingw-w64-x86_64-vulkan-headers

     
      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DENABLE_WERROR=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_CMD=OFF \
            -DENABLE_LIBUSB=OFF \
            -Denet_FORCE_BUNDLED=ON \
            -Dlibusb_FORCE_BUNDLED=ON \
            -DVulkanMemoryAllocator_FORCE_BUNDLED=ON

      - name: Compile
        shell: msys2 {0}
        run: ninja -C build yuzu

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-NS2-Windows
          path: build/bin/
          if-no-files-found: error
          retention-days: 7
